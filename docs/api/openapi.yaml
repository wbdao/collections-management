        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /security/me:
    get:
      operationId: getSecuritySummary
      summary: Get the caller's rate-limit and session security summary
      description: Requires an authenticated Bearer token only; no additional permission.
      tags: [Security]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 JWT access token (15 minutes) issued by POST /auth/login or
        POST /auth/refresh. On the four /auth/mfa/* routes a short-lived
        `cms-mfa` challenge token is also accepted; it is verified with audience
        `cms-mfa` and without a revocation lookup, and is valid nowhere else.
    BootstrapToken:
      type: apiKey
      in: header
      name: X-Bootstrap-Token
      description: Shared bootstrap secret, accepted only by POST /admin/bootstrap.
    BackupServiceToken:
      type: apiKey
      in: header
      name: X-Backup-Token
      description: |
        DORMANT / NOT DEPLOYED. Retained for design history only; the backup
        routes are not mounted, so this token is not accepted by any active
        endpoint. R2 is skipped.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Document or record identifier (URL-decoded by the router).
      schema:
        type: string
    AccountParam:
      name: account
      in: path
      required: true
      description: Unique customer account identifier in the external master.
      schema:
        type: string
    TypeParam:
      name: type
      in: path
      required: true
      description: Document type discriminator.
      schema:
        $ref: '#/components/schemas/DocumentType'
    NumberParam:
      name: number
      in: path
      required: true
      description: Human-readable document number to search for.
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return (coerced to a number).
      schema:
        type: integer
        minimum: 1
    OffsetParam:
      name: offset
      in: query
      required: false
      description: Number of records to skip (coerced to a number).
      schema:
        type: integer
        minimum: 0
    PageParam:
      name: page
      in: query
      required: false
      description: One-based page number (coerced to a number).
      schema:
        type: integer
        minimum: 1
    DescendingParam:
      name: descending
      in: query
      required: false
      description: Sort descending; only the literal string `true` is treated as true.
      schema:
        type: boolean
    StatusQueryParam:
      name: status
      in: query
      required: false
      description: Status filter passed through to the repository module.
      schema:
        type: string
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional client-generated key used by the repository to deduplicate
        repeated mutations. Forwarded to Apps Script in the signed envelope.
      schema:
        $ref: '#/components/schemas/IdempotencyKeyHeader'

  responses:
    Success:
      description: Successful response in the standard success envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    LoginSuccess:
      description: |
        Login succeeded. `data` is a token pair, or an MFA challenge descriptor
        when `mfaRequired` is true (then no access token is issued).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginSuccessEnvelope'
    TokenSuccess:
      description: Token pair issued (refresh rotation or MFA verification).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenSuccessEnvelope'
    AuditVerifySuccess:
      description: Hash-chain verification result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuditVerifySuccessEnvelope'
    AttachmentDownload:
      description: |
        DORMANT / NOT DEPLOYED. Reference response definition from the skipped
        R2 attachment design. The download route is not mounted.
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    BadRequest:
      description: Malformed request, unknown entity or duplicate key (400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, expired, revoked or invalid credentials (401).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Role/permission/scope denied, or cross-site mutation rejected (403).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Route, record, session or customer not found (404).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Version conflict, append-only violation or gated approval state (409).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Body validation failed or file/customer-master constraints violated (422/400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: KV-backed rate limit exceeded (429).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Unexpected server, configuration or middleware error (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Upstream timeout, lock timeout or Apps Script unavailable (503).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  requestBodies:
    LoginBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
    RefreshBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshRequest'
    LogoutBody:
      required: false
      description: Omit the body to revoke only the current session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LogoutRequest'
    MfaEnrollBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MfaEnrollRequest'
    MfaVerifyBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MfaVerifyRequest'
    MfaDisableBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MfaDisableRequest'
    MfaResendBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MfaResendRequest'
    ApprovalDecisionBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApprovalDecisionRequest'
    TreasuryCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TreasuryCreateRequest'
    TreasuryPatchBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TreasuryPatchRequest'
    BatchCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BatchCreateRequest'
    BookCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookCreateRequest'
    AssignmentBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssignmentRequest'
    CollectBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CollectRequest'
    DepositCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DepositCreateRequest'
    ChequeCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChequeCreateRequest'
    GuaranteeCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GuaranteeCreateRequest'
    TransitionBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransitionRequest'
    MovementCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MovementCreateRequest'
    # DORMANT / NOT DEPLOYED — R2 attachment routes are not mounted.
    AttachmentUploadBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/AttachmentUploadRequest'
    GenericJsonBody:
      required: false
      description: |
        Route-specific JSON object. Where the router declares no named validator,
        fields are validated by the business module / repository instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'

  schemas:
    IdempotencyKeyHeader:
      type: string
      description: |
        Client-generated idempotency key. Included in the signed Apps Script
        envelope so repeated mutations can be deduplicated.

    ResponseMeta:
      type: object
      description: Metadata attached to every successful response.
      properties:
        requestId:
          type: string
          description: Request correlation id (X-Request-Id header or generated UUID).
      additionalProperties: true

    SuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
          description: Always true for successful calls.
        data:
          description: Route-specific payload; may be an object, array or scalar.
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      additionalProperties: false

    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
          description: Always false for failed calls.
        error:
          $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false

    ErrorDetail:
      type: object
      required: [code, message, details, requestId]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Human-readable, API-safe error message.
        details:
          type: array
          description: |
            Structured diagnostics. Body validation failures produce entries
            such as `{field, issue}`; most other errors return an empty array.
          items:
            type: object
            additionalProperties: true
        requestId:
          type: string
          description: Request correlation id for support/debugging.
      additionalProperties: false

    ErrorCode:
      type: string
      description: |
        All error codes emitted by the router, middleware, edge modules and the
        Apps Script backend (via `mapCode()` in `functions/_lib/gas-client.js`).

        HTTP mapping:
        * 400: VALIDATION_ERROR, UNKNOWN_ENTITY, DUPLICATE_KEY
        * 401: UNAUTHORIZED, INVALID_CREDENTIALS, ACCOUNT_DISABLED, ACCOUNT_LOCKED,
          MFA_REQUIRED, MFA_INVALID, MFA_CHALLENGE_EXPIRED, MFA_CHALLENGE_FAILED,
          REFRESH_INVALID, REFRESH_REUSE, TOKEN_EXPIRED
        * 403: FORBIDDEN, CSRF_REJECTED
        * 404: NOT_FOUND, CUSTOMER_NOT_FOUND, SESSION_NOT_FOUND
        * 409: CONFLICT, CONFLICT_VERSION, APPEND_ONLY, APPROVAL_REQUIRED,
          APPROVAL_DECIDED, APPROVAL_REJECTED, APPROVAL_EXPIRED, HASH_CHAIN_INVALID
        * 422: CUSTOMER_MASTER_NOT_CONFIGURED, CUSTOMER_MASTER_UNAVAILABLE,
          CUSTOMER_MASTER_SHEET_NOT_FOUND, CUSTOMER_MASTER_SCHEMA, FILE_TOO_LARGE,
          FILE_TYPE_REJECTED
        * 429: RATE_LIMITED
        * 502: BAD_GATEWAY
        * 500: CONFIG_ERROR, MIDDLEWARE_ERROR, INTERNAL_ERROR, REQUEST_ERROR,
          and any unmapped upstream code
        * 503: UPSTREAM_TIMEOUT, LOCK_TIMEOUT, UPSTREAM_UNAVAILABLE
      enum:
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - ACCOUNT_DISABLED
        - ACCOUNT_LOCKED
        - MFA_REQUIRED
        - MFA_INVALID
        - MFA_CHALLENGE_EXPIRED
        - MFA_CHALLENGE_FAILED
        - REFRESH_INVALID
        - REFRESH_REUSE
        - TOKEN_EXPIRED
        - NOT_FOUND
        - CUSTOMER_NOT_FOUND
        - SESSION_NOT_FOUND
        - CUSTOMER_MASTER_NOT_CONFIGURED
        - CUSTOMER_MASTER_UNAVAILABLE
        - CUSTOMER_MASTER_SHEET_NOT_FOUND
        - CUSTOMER_MASTER_SCHEMA
        - FILE_TOO_LARGE
        - FILE_TYPE_REJECTED
        - VALIDATION_ERROR
        - UNKNOWN_ENTITY
        - DUPLICATE_KEY
        - FORBIDDEN
        - CSRF_REJECTED
        - CONFLICT
        - CONFLICT_VERSION
        - APPEND_ONLY
        - APPROVAL_REQUIRED
        - APPROVAL_DECIDED
        - APPROVAL_REJECTED
        - APPROVAL_EXPIRED
        - HASH_CHAIN_INVALID
        - RATE_LIMITED
        - UPSTREAM_TIMEOUT
        - LOCK_TIMEOUT
        - UPSTREAM_UNAVAILABLE
        - BAD_GATEWAY
        - CONFIG_ERROR
        - INTERNAL_ERROR
        - REQUEST_ERROR
        - MIDDLEWARE_ERROR
        - BACKUP_FAILED

    GenericObject:
      type: object
      description: Arbitrary JSON object accepted by routes without a named validator.
      additionalProperties: true

    Role:
      type: string
      description: Roles defined in shared/constants/enums.js.
      enum: [ADMIN, BRANCH_MANAGER, COLLECTOR, TREASURY, AUDITOR]

    DocumentType:
      type: string
      description: Documents tracked by movements and tracking endpoints.
      enum: [BOOK, RECEIPT, CHEQUE, GUARANTEE]

    BookStatus:
      type: string
      enum: [AVAILABLE, ASSIGNED, COMPLETED, CANCELLED, LOST]

    ReceiptStatus:
      type: string
      enum: [UNUSED, COLLECTED, DEPOSITED_BRANCH, DEPOSITED_HQ, CANCELLED, LOST]

    BatchStatus:
      type: string
      enum: [EXPECTED, RECEIVED, INSPECTED, ACTIVE, QUARANTINED, RETURNED_TO_SUPPLIER, CLOSED]

    ChequeStatus:
      type: string
      enum: [AT_BRANCH, SENT_TO_HQ, AT_BANK, CLEARING, CLEARED, RETURNED]

    GuaranteeStatus:
      type: string
      enum: [AT_BRANCH, AT_HQ, LEGAL_DEPARTMENT, RELEASED, CLOSED]

    TreasuryType:
      type: string
      enum: [BRANCH, HQ]

    TreasuryStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    PaymentMethod:
      type: string
      enum: [CASH, CHEQUE, OTHER]

    AlertType:
      type: string
      enum: [GUARANTEE_EXPIRY, CHEQUE_OVERDUE, CUSTODY_VARIANCE, FAILED_RECONCILIATION]

    AlertBucket:
      type: string
      enum: [DUE_30, DUE_15, DUE_7, EXPIRED, NA]

    CustodyHolderType:
      type: string
      enum: [COLLECTOR, BRANCH_TREASURY, HQ_TREASURY, WAREHOUSE, BANK, LEGAL]

    NotificationType:
      type: string
      enum: [GUARANTEE_EXPIRY, CHEQUE_OVERDUE, CUSTODY_VARIANCE, FAILED_RECONCILIATION]

    NotificationChannel:
      type: string
      enum: [IN_APP, EMAIL, SMS]

    ApprovalStatus:
      type: string
      enum: [PENDING_APPROVAL, APPROVED, REJECTED]

    ApprovalEntity:
      type: string
      enum: [HQ_DEPOSIT, CHEQUE_STATUS_CHANGE, GUARANTEE_RELEASE]

    MfaType:
      type: string
      enum: [TOTP, EMAIL_OTP]

    User:
      type: object
      description: A CMS user record.
      properties:
        user_id:
          type: string
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        status:
          type: string
          description: Active/disabled/locked account state as managed by Apps Script.
        mfa_enabled:
          type: boolean
        mfa_methods:
          type: array
          items:
            $ref: '#/components/schemas/MfaType'
        created_at:
          type: string
          format: date-time
        locked_until:
          type: string
          format: date-time
      additionalProperties: true

    Session:
      type: object
      description: A login session (tbl_sessions).
      properties:
        session_id:
          type: string
          format: uuid
        user_id:
          type: string
        username:
          type: string
        device_info:
          type: string
          description: User-Agent captured at login.
        ip_address:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Refresh-token expiry (7 days after login).
        revoked_at:
          type: string
          format: date-time
          nullable: true
        rotated_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: True only for the session used by the current request.
      additionalProperties: true

    TokenPair:
      type: object
      description: Access/refresh token pair returned by login, refresh and MFA verify.
      properties:
        accessToken:
          type: string
          description: RS256 JWT, 15 minute lifetime.
        refreshToken:
          type: string
          description: Opaque 256-bit token, 7 day lifetime, single use with rotation.
        expiresIn:
          type: integer
          description: Access token lifetime in seconds (900).
        sessionId:
          type: string
          format: uuid
        sid:
          type: string
          description: Alias of sessionId retained for backwards compatibility.
        user:
          $ref: '#/components/schemas/User'
        mfaEnabled:
          type: boolean
      additionalProperties: true

    MfaChallenge:
      type: object
      description: Returned by login instead of a token pair when MFA is required.
      properties:
        mfaRequired:
          type: boolean
          enum: [true]
        mfaToken:
          type: string
          description: Short-lived JWT with audience `cms-mfa` (5 minutes).
        methods:
          type: array
          items:
            $ref: '#/components/schemas/MfaType'
      additionalProperties: true

    LoginSuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          oneOf:
            - $ref: '#/components/schemas/TokenPair'
            - $ref: '#/components/schemas/MfaChallenge'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    TokenSuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/TokenPair'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    AuditLog:
      type: object
      description: Append-only audit record.
      properties:
        audit_id:
          type: string
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        entity:
          type: string
        entity_id:
          type: string
        result:
          type: string
          enum: [SUCCESS, FAILURE]
        ip_address:
          type: string
        request_id:
          type: string
        hash:
          type: string
          description: SHA-256 chain hash of this record.
        previous_hash:
          type: string
      additionalProperties: true

    SecurityEvent:
      type: object
      description: |
        Append-only security event record (tbl_security_events). Known types
        include AUDIT_VERIFY_FAILED, TOKEN_REUSE_DETECTED, SESSION_REVOKED,
        MFA_CHALLENGE_FAILED, ACCOUNT_LOCKED, RATE_LIMITED, JWT_REVOKED,
        BACKUP_FAILED and ADMIN_UNLOCK.
      properties:
        event_id:
          type: string
        event_type:
          type: string
        user_id:
          type: string
        ip_address:
          type: string
        detail:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: true

    # DORMANT / NOT DEPLOYED — R2 backup routes are not mounted.
    Backup:
      type: object
      description: Reference schema from the skipped R2 backup design; no backup rows are written in production.
      properties:
        backup_id:
          type: string
        status:
          type: string
          enum: [COMPLETED, FAILED]
        r2_key:
          type: string
          description: backups/yyyy/mm/dd/<backup-id>.json in the private bucket.
        size_bytes:
          type: integer
        checksum:
          type: string
          description: SHA-256 checksum of the serialized workbook payload.
        created_at:
          type: string
          format: date-time
        retention_until:
          type: string
          format: date-time
          description: Creation time plus 90 days.
        triggered_by:
          type: string
          description: Admin user id or SYSTEM for the Apps Script daily trigger.
      additionalProperties: true

    # DORMANT / NOT DEPLOYED — R2 attachment routes are not mounted.
    Attachment:
      type: object
      description: Reference schema from the skipped R2 attachment design; no attachment rows are written in production.
      properties:
        attachment_id:
          type: string
        entity_type:
          type: string
          enum: [CHEQUE, GUARANTEE, DEPOSIT]
        entity_id:
          type: string
        file_name:
          type: string
        content_type:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        size_bytes:
          type: integer
          maximum: 10485760
        r2_key:
          type: string
        uploaded_by:
          type: string
        uploaded_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: true

    Notification:
      type: object
      description: In-app notification record.
      properties:
        notification_id:
          type: string
        user_id:
          type: string
        type:
          $ref: '#/components/schemas/NotificationType'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        status:
          type: string
          enum: [UNREAD, READ]
        title:
          type: string
        body:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        created_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: true

    Approval:
      type: object
      description: Approval request for a gated transition.
      properties:
        approval_id:
          type: string
        entity_type:
          $ref: '#/components/schemas/ApprovalEntity'
        entity_id:
          type: string
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        requested_by:
          type: string
        requested_at:
          type: string
          format: date-time
        decided_by:
          type: string
        decided_at:
          type: string
          format: date-time
        notes:
          type: string
        reason:
          type: string
      additionalProperties: true

    AuditVerifySuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            valid:
              type: boolean
            recordsChecked:
              type: integer
            firstFailure:
              type: object
              nullable: true
            issues:
              type: array
              items:
                type: object
                properties:
                  auditId:
                    type: string
                  type:
                    type: string
                  detail:
                    type: string
            checkedAt:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    Treasury:
      type: object
      description: Branch or HQ treasury (tbl_treasuries).
      properties:
        treasury_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{2,40}$'
          description: Immutable business key.
        treasury_name:
          type: string
        treasury_type:
          $ref: '#/components/schemas/TreasuryType'
        warehouse:
          type: string
        status:
          $ref: '#/components/schemas/TreasuryStatus'
      additionalProperties: true

    Customer:
