  /admin/security/unlock:
    post:
      operationId: unlockUser
      summary: Unlock a locked user account (ADMIN)
      description: Phase 2 Step 11. Unlocks the account identified by `userId`; writes an ADMIN_UNLOCK security event.
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
