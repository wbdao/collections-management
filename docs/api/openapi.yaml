openapi: 3.0.3

info:
  title: Collections Management System (CMS) API
  version: 1.0.0
  description: |
    REST API for the Collections Management System (CMS). This specification covers
    all Phase 1 routes plus the active Phase 2 routes. The API is a Cloudflare
    Pages Function catch-all router (`functions/api/[[path]].js`) with edge middleware
    (`functions/api/_middleware.js`) and forwards business operations through a
    Repository Interface to an Apps Script / Google Sheets backend.

    Google Sheets is the only storage backend. R2 is skipped: Step 6 (attachments)
    and Step 12 (backups) are dormant reference code and are not mounted, so those
    endpoints are intentionally absent from this specification.

    ## Authentication and tokens
    * Access tokens are RS256 JWTs valid for **15 minutes** (900 s). Send them as
      `Authorization: Bearer <accessToken>` on every protected route.
    * Refresh tokens are opaque 256-bit values valid for **7 days**. They are rotated
      on every use (`POST /auth/refresh`); reuse of a rotated token is detected and
      revokes the whole session family (`REFRESH_REUSE`, HTTP 401).
    * When MFA is enforced, `POST /auth/login` returns `mfaRequired: true` and a
      short-lived **MFA challenge token** (audience `cms-mfa`, 5 minutes) instead of
      an access token. Challenge tokens are accepted **only** on the four
      `/auth/mfa/*` routes and cannot access any other endpoint.
    * `POST /admin/bootstrap` uses a shared secret in the `X-Bootstrap-Token` header
      instead of a JWT.

    ## Rate limiting
    All limits are KV-backed and degrade open if KV is unavailable: 10/min for login,
    120/min per user for the API, 300/min per IP for every non-OPTIONS request,
    20/min for auth-user operations (login/refresh/MFA), and 5 per 5 minutes for MFA
    verification. Exceeding a limit returns 429 `RATE_LIMITED` and writes a
    `RATE_LIMITED` security event.

    ## Data access and scoping
    Datasets are scoped by RBAC: the caller's role, permission set and document
    scopes determine which rows are visible. Role permissions are additive between
    Phase 1 and Phase 2. Sensitive endpoints also require an explicit scope.

    ## Response envelopes
    Successful JSON calls return `{ok:true, data:<payload>, meta:{requestId,...}}`.
    Failures return `{ok:false, error:{code,message,details,requestId}}`. The
    `X-Request-Id` request header is echoed as `meta.requestId` / `error.requestId`
    when supplied. Mutating routes accept an optional `Idempotency-Key` header;
    optimistic locking uses a `version` field in the JSON body. All active routes
    return JSON envelopes. The health endpoint is also mounted at `/api/health`
    (without the `/v1` prefix).

    ## Error code mapping
    The complete error-code to HTTP-status mapping is documented in the
    `ErrorCode` schema and in the root-level `x-error-code-status-map` extension.
  contact:
    name: CMS Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8788/api/v1
    description: Local development server (wrangler pages dev).
  - url: https://collections-management.pages.dev/api/v1
    description: Production Cloudflare Pages deployment.

security:
  - BearerAuth: []

tags:
  - name: Health
    description: Liveness and upstream repository probes.
  - name: Authentication
    description: Login, refresh, logout, identity and session management.
  - name: MFA
    description: TOTP / email OTP enrolment, verification, disable and resend.
  - name: Admin
    description: Users, roles, settings, registry and account administration.
  - name: Customers
    description: Read-only lookups against the external customer master.
  - name: Books
    description: Book inventory, assignment, return, transitions and updates.
  - name: Batches
    description: Book batch intake, inspection, reporting and transitions.
  - name: Receipts
    description: Receipt lifecycle including collection, cancellation and loss.
  - name: Collections
    description: Collector collection records and reconciliation.
  - name: Deposits
    description: Branch and HQ deposit documents and confirmation.
  - name: Cheques
    description: Cheque records, lists and state transitions.
  - name: Guarantees
    description: Guarantee records, alerts and state transitions.
  - name: Movements
    description: Document movement log and history.
  - name: Custody
    description: Custody balances, ledger, exceptions and reconciliation.
  - name: Tracking
    description: Universal document tracking by number.
  - name: Alerts
    description: Alert list, summary, scanning and acknowledgement.
  - name: Dashboard
    description: Dashboard aggregates and derived structure.
  - name: Reports
    description: Standard and Phase 2 advanced reports and KPIs.
  - name: Audit
    description: Append-only audit log and hash-chain integrity verification.
  - name: Treasury
    description: Branch / HQ treasury registry (Phase 2 Step 4).
  - name: Notifications
    description: In-app notification inbox (Phase 2 Step 5).
  - name: Approvals
    description: Approval queue and decisions for gated transitions (Step 7).
  - name: Security
    description: Security event log and caller security summary (Step 11).

