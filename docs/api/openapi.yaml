  MFA_CHALLENGE_EXPIRED: 401
  MFA_CHALLENGE_FAILED: 401
  REFRESH_INVALID: 401
  REFRESH_REUSE: 401
  TOKEN_EXPIRED: 401
  NOT_FOUND: 404
  CUSTOMER_NOT_FOUND: 404
  SESSION_NOT_FOUND: 404
  CUSTOMER_MASTER_NOT_CONFIGURED: 422
  CUSTOMER_MASTER_UNAVAILABLE: 422
  CUSTOMER_MASTER_SHEET_NOT_FOUND: 422
  CUSTOMER_MASTER_SCHEMA: 422
  FILE_TOO_LARGE: 422
  FILE_TYPE_REJECTED: 422
  VALIDATION_ERROR: 400
  UNKNOWN_ENTITY: 400
