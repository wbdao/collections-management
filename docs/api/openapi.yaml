  BACKUP_FAILED: 500

paths:
  /health:
    get:
      operationId: getHealth
      summary: Public service health probe
      description: Returns service name and current UTC time. Also mounted at /api/health without the /v1 prefix. No authentication required.
      tags: [Health]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /ping:
    get:
      operationId: pingRepository
      summary: Probe the Apps Script repository
      description: Calls the repository `ping` action through the signed Apps Script transport. Requires a Bearer token.
      tags: [Health]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/login:
    post:
      operationId: login
      summary: Authenticate and issue tokens
      description: |
        Public endpoint. Verifies credentials in Apps Script, creates a session row,
        and returns a 15-minute access token plus a 7-day refresh token. When MFA is
        required for the user's role, returns an MFA challenge instead of a token pair.
      tags: [Authentication]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/LoginBody'
      responses:
        '200': { $ref: '#/components/responses/LoginSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate a refresh token and issue a new token pair
      description: |
        Public endpoint: the access token is expected to be expired. Authenticated
        solely by the opaque refresh token. Reuse of an already-rotated token revokes
        all sessions for the user (`REFRESH_REUSE`).
      tags: [Authentication]
      security: []
      requestBody:
        $ref: '#/components/requestBodies/RefreshBody'
      responses:
        '200': { $ref: '#/components/responses/TokenSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session (or all sessions)
      description: Revokes the session identified by the access token's `sid`, adds its `jti` to the KV denylist, and revokes the presented refresh token. `{all:true}` revokes every session for the user.
      tags: [Authentication]
      security: [{ BearerAuth: [] }]
      requestBody:
        $ref: '#/components/requestBodies/LogoutBody'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current authenticated user
      description: Returns the caller's identity, role, permissions, scopes, session id, `mfaEnabled` and `mfaMethods`.
      tags: [Authentication]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/sessions:
    get:
      operationId: listSessions
      summary: List the caller's sessions
      description: Returns session rows including device info, IP, creation/expiry, revocation and `current` flag. Requires `sessions.read`.
      tags: [Authentication]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/mfa/enroll:
    post:
      operationId: mfaEnroll
      summary: Enrol an MFA method
      description: |
        Requires an authenticated session or a `cms-mfa` challenge token. TOTP
        enrolment returns a base32 secret, provisioning URI and recovery codes;
        EMAIL_OTP returns a challenge id to confirm with /auth/mfa/verify.
      tags: [MFA]
      security: [{ BearerAuth: [] }]
      requestBody:
        $ref: '#/components/requestBodies/MfaEnrollBody'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/mfa/verify:
    post:
      operationId: mfaVerify
      summary: Verify an MFA code and complete login or enrolment
      description: |
        Accepts a six-digit OTP/TOTP or recovery code. On the login challenge flow,
        pass the `mfaToken` from /auth/login; a full token pair is returned. A
        `cms-mfa` audience token is accepted here (and only on /auth/mfa/*).
      tags: [MFA]
      security: [{ BearerAuth: [] }]
      requestBody:
        $ref: '#/components/requestBodies/MfaVerifyBody'
      responses:
        '200': { $ref: '#/components/responses/TokenSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/mfa/disable:
    post:
      operationId: mfaDisable
      summary: Disable an MFA method
      description: Requires a valid code. Blocked when the role policy (`auth.mfa.requiredRoles`) requires MFA.
      tags: [MFA]
      security: [{ BearerAuth: [] }]
      requestBody:
        $ref: '#/components/requestBodies/MfaDisableBody'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/mfa/resend:
    post:
      operationId: mfaResend
      summary: Resend an email OTP challenge
      description: Re-sends the EMAIL_OTP challenge for the caller. Rate limited by the MFA challenge bucket (5 per 5 minutes).
      tags: [MFA]
      security: [{ BearerAuth: [] }]
      requestBody:
        $ref: '#/components/requestBodies/MfaResendBody'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/bootstrap:
    post:
      operationId: bootstrap
      summary: Seed all system sheets (bootstrap secret)
      description: Calls the repository `bootstrap` action. Authenticated solely by the `X-Bootstrap-Token` header and subject to a dedicated per-IP limit.
      tags: [Admin]
      security: [{ BootstrapToken: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        $ref: '#/components/requestBodies/GenericJsonBody'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/users:
    get:
      operationId: listUsers
      summary: List users
      description: Requires `users.manage`. The raw query object is passed to the repository list action.
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/roles:
    get:
      operationId: listRoles
      summary: List roles and their definitions
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/role-permissions:
    get:
      operationId: listRolePermissions
      summary: List the role-to-permission map
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/settings:
    get:
      operationId: getSettings
      summary: Get system settings and policy flags
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/registry/status:
    get:
      operationId: getRegistryStatus
      summary: Get workbook registry / split status (ADMIN)
      description: Phase 2 Step 9. Manual cutover status for the split workbook registry.
      tags: [Admin]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
