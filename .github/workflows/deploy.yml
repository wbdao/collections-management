name: Test and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: collections-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund

      - name: Inject KV namespace IDs from GitHub Variables
        env:
          KV_ID: ${{ vars.KV_NAMESPACE_ID }}
          PREVIEW_KV_ID: ${{ vars.PREVIEW_KV_NAMESPACE_ID }}
        run: |
          test -n "$KV_ID" || { echo "Missing GitHub Variable KV_NAMESPACE_ID"; exit 1; }
          test -n "$PREVIEW_KV_ID" || { echo "Missing GitHub Variable PREVIEW_KV_NAMESPACE_ID"; exit 1; }
          sed -i "s|REPLACE_WITH_KV_NAMESPACE_ID|$KV_ID|" wrangler.toml
          sed -i "s|REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID|$PREVIEW_KV_ID|" wrangler.toml
          ! grep -q 'REPLACE_WITH_' wrangler.toml

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_SHARED_SECRET: ${{ secrets.GAS_SHARED_SECRET }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
        run: |
          # The project must exist before Pages secrets can be uploaded.
          npx wrangler pages project create collections-management --production-branch main || true

          # Build a JSON file of secrets for the Pages-specific bulk command.
          node -e '
            const fs = require("fs");
            const keys = ["GAS_URL","GAS_SHARED_SECRET","JWT_PRIVATE_KEY","JWT_PUBLIC_KEY","JWT_ISSUER","JWT_AUDIENCE","BOOTSTRAP_TOKEN"];
            const out = {};
            for (const k of keys) out[k] = process.env[k] || "";
            fs.writeFileSync("pages-secrets.json", JSON.stringify(out));
          '
          npx wrangler pages secret bulk pages-secrets.json --project-name=collections-management
          rm -f pages-secrets.json

          npx wrangler pages deploy frontend --project-name=collections-management --branch=main
